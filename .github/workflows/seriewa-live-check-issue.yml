name: SERIE W temporary live check

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read

jobs:
  verify:
    if: startsWith(github.event.issue.title, '[SERIEWA-LIVE-CHECK]')
    runs-on: ubuntu-latest
    steps:
      - name: Verify public article
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node <<'NODE' > "$RUNNER_TEMP/result.json"
          (async () => {
            const req = JSON.parse(process.env.ISSUE_BODY || '{}');
            const r = await fetch(req.url, { cache: 'no-store' });
            const html = await r.text();
            const checks = {};
            for (const [key, value] of Object.entries(req.contains || {})) checks[key] = html.includes(value);
            const ok = r.ok && Object.values(checks).every(Boolean);
            process.stdout.write(JSON.stringify({ok,http_status:r.status,checks}));
          })().catch(e => { process.stdout.write(JSON.stringify({ok:false,error:String(e?.message||e)})); });
          NODE
      - name: Comment result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "LIVE_CHECK $(cat "$RUNNER_TEMP/result.json")"
