name: Publish SERIE W blog from ChatGPT

on:
  repository_dispatch:
    types: [publish_seriewa_blog]

permissions:
  contents: write

concurrency:
  group: seriewa-blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SERIEWA_BLOG_PAYLOAD: ${{ toJson(github.event.client_payload) }}
      SERIEWA_CLOUDINARY_RESULT_FILE: ${{ runner.temp }}/seriewa-cloudinary-images.json

    steps:
      - name: Check out the current site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload article images to Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: node scripts/upload-images-to-cloudinary.mjs

      - name: Generate the new article and indexes
        run: node scripts/publish-blog-from-chatgpt.mjs

      - name: Validate generated files and Cloudinary URLs
        run: |
          git diff --check
          test -n "$(git status --short)"
          if test -s "$SERIEWA_CLOUDINARY_RESULT_FILE"; then
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.env.SERIEWA_CLOUDINARY_RESULT_FILE));for(const i of r.images||[]){if(!/^https:\/\/res\.cloudinary\.com\//.test(i.secure_url))process.exit(1)}'
          fi

      - name: Publish to the main branch
        run: |
          git config user.name "SERIE W Blog Bot"
          git config user.email "250153830+nishinomasashi84-svg@users.noreply.github.com"
          git add -- blog index.html sitemap.xml
          git commit -m "Publish blog article from ChatGPT"
          git push origin HEAD:main
