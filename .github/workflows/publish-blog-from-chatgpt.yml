name: Publish SERIE W blog from ChatGPT

on:
  repository_dispatch:
    types: [publish_seriewa_blog]

permissions:
  contents: write

concurrency:
  group: seriewa-blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate the new article and indexes
        env:
          SERIEWA_BLOG_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node scripts/publish-blog-from-chatgpt.mjs

      - name: Validate generated files
        run: |
          git diff --check
          test -n "$(git status --short)"

      - name: Publish to the main branch
        run: |
          git config user.name "SERIE W Blog Bot"
          git config user.email "250153830+nishinomasashi84-svg@users.noreply.github.com"
          git add -- blog index.html sitemap.xml
          git commit -m "Publish blog article from ChatGPT"
          git push origin HEAD:main
