name: Fix structured data

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: structured-data-main
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate structured data
        run: node scripts/generate-structured-data.mjs

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Structured data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html schedule/index.html blog/index.html blog/*/index.html
          git commit -m "構造化データを自動更新"
          git push
