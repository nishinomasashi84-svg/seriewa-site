name: Cloudinary upload smoke test

on:
  push:
    branches: [feat/cloudinary-blog-images]
    paths:
      - '.seriewa/upload-requests/*.json'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/cloudinary-blog-images

      - name: Prepare upload request
        shell: bash
        run: |
          request="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" | grep '^\.seriewa/upload-requests/.*\.json$' | head -n 1)"
          test -n "$request"
          request_id="$(basename "$request" .json)"
          payload="$(jq -c . "$request")"
          echo "SERIEWA_BLOG_PAYLOAD=$payload" >> "$GITHUB_ENV"
          echo "SERIEWA_CLOUDINARY_RESULT_FILE=$RUNNER_TEMP/cloudinary-result.json" >> "$GITHUB_ENV"
          echo "RESULT_PATH=.seriewa/upload-results/$request_id.json" >> "$GITHUB_ENV"

      - name: Upload image and capture outcome
        shell: bash
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          set +e
          node scripts/upload-images-to-cloudinary.mjs > "$RUNNER_TEMP/cloudinary-upload.log" 2>&1
          status=$?
          set -e
          mkdir -p "$(dirname "$RESULT_PATH")"
          if [ "$status" -eq 0 ] && [ -s "$SERIEWA_CLOUDINARY_RESULT_FILE" ]; then
            node -e 'const fs=require("fs");const p=process.env.SERIEWA_CLOUDINARY_RESULT_FILE;const r=JSON.parse(fs.readFileSync(p));fs.writeFileSync(process.env.RESULT_PATH,JSON.stringify({ok:true,...r},null,2)+"\n")'
          else
            node -e 'const fs=require("fs");const log=fs.readFileSync(process.env.RUNNER_TEMP+"/cloudinary-upload.log","utf8").slice(-4000);fs.writeFileSync(process.env.RESULT_PATH,JSON.stringify({ok:false,error:log},null,2)+"\n")'
          fi

      - name: Save smoke test result
        shell: bash
        run: |
          git config user.name "SERIE W Cloudinary Test"
          git config user.email "250153830+nishinomasashi84-svg@users.noreply.github.com"
          git add "$RESULT_PATH"
          git commit -m "Record Cloudinary upload smoke test"
          git push origin HEAD:feat/cloudinary-blog-images
